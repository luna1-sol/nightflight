name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests group by branch and drop superseded runs; every push to
# master runs to the end. Keying both on github.ref let a late run for an
# already merged pull request (whose ref is master) cancel master's own CI.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !github.event.repository.fork }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browser:
    # Loads the built site in headless Chromium (software WebGL) and checks
    # that lights draw, survive a WebGL context loss, keep going across the
    # date line, and that display settings apply. Needs the public map tiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    # Publishes dist/ to GitHub Pages from master of the original repository
    # only; forks skip this. One-time setup: Settings → Pages → Source:
    # "GitHub Actions".
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !github.event.repository.fork }}
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
